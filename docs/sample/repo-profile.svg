<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img">
<style>
.title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; }
.subtitle, .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
